name: octapoint-pro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octapoint
      POSTGRES_PASSWORD: octapoint
      POSTGRES_DB: octapoint
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octapoint"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-gateway:
    build: ./packages/api-gateway
    env_file: .env
    environment:
      DATABASE_URL: postgresql://octapoint:octapoint@postgres:5432/octapoint
      REDIS_URL: redis://redis:6379
    ports: ["4200:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "npx prisma db push --skip-generate && npm run dev"
    volumes:
      - ./packages/api-gateway/src:/app/src
      - auditdata:/app/.audit-store
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  demo-seed:
    image: node:20-alpine
    env_file: .env
    environment:
      OCTAPOINT_BASE_URL: http://api-gateway:4000
    working_dir: /app
    command: ["node", "scripts/bootstrap-demo.mjs"]
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: "no"

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    env_file: .env
    environment:
      OCTAPOINT_BASE_URL: http://api-gateway:4000
    ports: ["4300:4100"]
    depends_on:
      demo-seed: { condition: service_completed_successfully }

  merchant-portal:
    build: ./apps/merchant-portal
    env_file: .env
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4200
    ports: ["3100:3000"]
    depends_on:
      demo-seed: { condition: service_completed_successfully }

  admin-portal:
    build: ./apps/admin-portal
    env_file: .env
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4200
    ports: ["3101:3001"]
    depends_on:
      demo-seed: { condition: service_completed_successfully }

volumes:
  pgdata:
  auditdata:
